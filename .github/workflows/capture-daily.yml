name: capture-daily

on:
  schedule:
    # Hourly incremental pull: each run reads only ~1-1.5h of captures (~30-60
    # envelopes), so no single 5-minute window can ever approach the Cloudflare
    # REST limit (1200 req / 5 min). Small and frequent beats one big burst.
    - cron: '7 * * * *'
    - cron: '0 2 * * *' # daily full-day scorecard, 10:00 Asia/Singapore
    - cron: '0 3 * * 1' # weekly review, 11:00 Asia/Singapore (previous 7 days)
  workflow_dispatch:
    inputs:
      last_minutes:
        description: 'Fast-window analysis in minutes (e.g. 60; 0 = full day)'
        required: false
        default: '0'
        type: string
      platform:
        description: 'Optional clientPlatform filter (gemini | chatgpt | claude)'
        required: false
        default: ''
        type: string
      commit:
        description: 'Optional buildCommit prefix filter'
        required: false
        default: ''
        type: string
      run_weekly:
        description: 'Also run the weekly review on this manual dispatch'
        required: false
        default: false
        type: boolean
      from_r2:
        description: 'Weekly fallback: scan R2 raw envelopes (explicit; may hit R2 REST 429)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *' || github.event.schedule == '0 2 * * *' || github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Incremental pull: restore the local store, fetch ONLY objects we have
      # never seen, then hand the store to digest/analyzer. Hourly runs fetch a
      # handful of new envelopes instead of re-reading the whole day.
      - name: Restore capture store
        uses: actions/cache/restore@v4
        with:
          path: work/capture-store
          key: capture-store-${{ github.run_id }}
          restore-keys: |
            capture-store-
      - name: Sync captures (incremental)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_AUTH_EMAIL: ${{ secrets.R2_AUTH_EMAIL }}
          R2_AUTH_KEY: ${{ secrets.R2_AUTH_KEY }}
        run: |
          RETAIN="${{ github.event.inputs.last_minutes }}"
          # Retention window for the local store (how far back analysis may go).
          if [ -z "$RETAIN" ] || [ "$RETAIN" = "0" ]; then RETAIN=1440; fi
          if [ "${{ github.event.schedule }}" = "7 * * * *" ]; then RETAIN=1440; fi
          node scripts/sync-captures.mjs --dir work/capture-store --retain-minutes "$RETAIN" --json
      - name: Save capture store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/capture-store
          key: capture-store-${{ github.run_id }}
      - name: Digest R2 captures
        id: digest
        run: |
          # No R2 reads here: the incremental sync already produced the store.
          DAY="$(date -u +%F)"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          node scripts/capture-digest.mjs --bundle work/capture-store/envelopes.ndjson --out work/digest --bundle-out work/digest/envelopes.ndjson
      - name: Analyze clusters with the free model (advisory only)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_AUTH_EMAIL: ${{ secrets.R2_AUTH_EMAIL }}
          R2_AUTH_KEY: ${{ secrets.R2_AUTH_KEY }}
          ANALYZER_BASE_URL: ${{ secrets.ANALYZER_BASE_URL }}
          ANALYZER_MODEL: ${{ secrets.ANALYZER_MODEL }}
          ANALYZER_API_KEY: ${{ secrets.ANALYZER_API_KEY }}
        run: |
          ARGS=(--out work/analyzer --bundle work/digest/envelopes.ndjson)
          LAST_MIN="${{ github.event.inputs.last_minutes }}"
          PLAT="${{ github.event.inputs.platform }}"
          CMT="${{ github.event.inputs.commit }}"
          # Match the digest window on the hourly incremental run.
          if [ "${{ github.event.schedule }}" = "7 * * * *" ]; then LAST_MIN=90; fi
          if [ -n "$LAST_MIN" ] && [ "$LAST_MIN" != "0" ]; then
            ARGS+=(--last-minutes "$LAST_MIN")
          else
            ARGS+=(--date "$(date -u +%F)")
          fi
          if [ -n "$PLAT" ]; then
            ARGS+=(--platform "$PLAT")
          fi
          if [ -n "$CMT" ]; then
            ARGS+=(--commit "$CMT")
          fi
          node scripts/analyze-captures.mjs "${ARGS[@]}"
      - name: Reject EMPTY_WINDOW (manual runs fail, scheduled runs warn)
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OUT="$(ls work/analyzer/analyzer-output-*.json 2>/dev/null | tail -n 1 || true)"
          if [ -z "$OUT" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::no analyzer-output produced (analysis did not complete)"
              exit 1
            fi
            echo "::warning::no analyzer-output produced"
            exit 0
          fi
          STATUS="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log(j.validated?.dataStatus ?? j.input?.dataStatus ?? 'unknown')" "$OUT")"
          echo "analyzer dataStatus=$STATUS"
          if [ "$STATUS" != "HAS_DATA" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::dataStatus=$STATUS (EMPTY_WINDOW/NOT_ENOUGH is not a pass)"
              exit 1
            fi
            echo "::warning::dataStatus=$STATUS (EMPTY_WINDOW/NOT_ENOUGH is not a pass)"
          fi
      - name: Keep scorecard in the repo
        run: |
          mkdir -p docs/eval
          DAY="${{ steps.digest.outputs.day }}"
          cp "work/digest/scorecard-$DAY.md" docs/eval/ 2>/dev/null || true
          cp "work/digest/scorecard-$DAY.json" docs/eval/ 2>/dev/null || true
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add "docs/eval/scorecard-$DAY.md" "docs/eval/scorecard-$DAY.json" 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(eval): capture scorecard $DAY"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: capture-digest
          path: |
            work/digest
            work/analyzer
          retention-days: 14

  weekly-review:
    needs: digest
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_weekly == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aggregate 7 days from committed scorecards (zero R2 requests)
        if: github.event.inputs.from_r2 != 'true'
        run: |
          SINCE="$(date -u -d '6 days ago' +%F)"
          echo "SINCE=$SINCE" >> "$GITHUB_ENV"
          node scripts/weekly-from-scorecards.mjs --since "$SINCE" --days 7 --out-dir docs/eval
      - name: Aggregate 7 days from R2 (explicit fallback)
        if: github.event.inputs.from_r2 == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_AUTH_EMAIL: ${{ secrets.R2_AUTH_EMAIL }}
          R2_AUTH_KEY: ${{ secrets.R2_AUTH_KEY }}
        run: |
          SINCE="$(date -u -d '7 days ago' +%F)"
          echo "SINCE=$SINCE" >> "$GITHUB_ENV"
          node scripts/capture-digest.mjs --since "$SINCE" --days 7 --out work/weekly
          # --dry-run never calls the model: the weekly report is a deterministic
          # candidate roll-up of clusters + evidence ids, not validated issues.
          node scripts/analyze-captures.mjs --since "$SINCE" --days 7 --dry-run --out work/weekly
      - name: Render docs/eval/weekly-YYYY-WW.md (R2 fallback only)
        if: github.event.inputs.from_r2 == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { isoWeek, renderWeeklyReview } from './scripts/analyze-captures.mjs';

          const since = process.env.SINCE;
          const label = `${since}+7d`;
          const digest = JSON.parse(await readFile(`work/weekly/scorecard-${label}.json`, 'utf8'));
          const analysis = JSON.parse(await readFile(`work/weekly/analyzer-input-${since}.json`, 'utf8'));
          const candidates = (analysis.clusters ?? []).slice(0, 10).map((cluster) => ({
            severity: 'P3',
            category: 'unknown',
            title: `${cluster.errorClass}/${cluster.server}/${cluster.tool} (${cluster.count} hits)`,
            evidenceEventIds: cluster.sampleEventIds ?? [],
          }));
          const md = renderWeeklyReview({
            week: isoWeek(since),
            since,
            days: 7,
            trend: analysis.trend ?? [],
            totals: digest.metrics ?? {},
            candidates,
          });
          await mkdir('docs/eval', { recursive: true });
          const path = `docs/eval/weekly-${isoWeek(since)}.md`;
          await writeFile(path, md, 'utf8');
          console.log(`[weekly] wrote ${path}: ${candidates.length} candidates`);
          NODE
      - name: Keep weekly review in the repo
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add docs/eval/weekly-*.md
          git diff --cached --quiet || git commit -m "chore(eval): weekly capture review $(date -u +%G-W%V)"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: capture-weekly-review
          path: |
            work/weekly
            docs/eval/weekly-*.md
          retention-days: 30

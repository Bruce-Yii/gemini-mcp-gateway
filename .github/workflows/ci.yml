name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit + integration tests
        run: npm test
      - name: Audit module boundaries\n        run: node scripts/check-module-boundaries.mjs\n      - name: Audit silent truncation (P0 blocks, P1 warns)
        run: node scripts/audit-truncation.mjs --ci
      - name: Audit committed tool snapshots
        run: node scripts/audit-tools.mjs --server figma
      - name: Check committed task coverage
        run: node scripts/check-task-coverage.mjs --server figma
      - name: Validate example configs
        run: |
          node scripts/check-config.mjs config.example.json
          for f in examples/*.json; do node scripts/check-config.mjs "$f"; done
          for f in templates/upstreams/*.json; do node scripts/check-config.mjs "$f"; done
      - name: Offline search evaluation
        run: node scripts/eval-search.mjs
      - name: Tool-face context measurement
        run: node scripts/measure-context.mjs
      - name: Benchmark harness dry run
        run: node bench/run.mjs --dry-run
      - name: Build identity self-check
        run: node scripts/write-build-info.mjs --print

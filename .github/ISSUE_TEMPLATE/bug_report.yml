name: Bug report
description: Something is broken or behaves unexpectedly
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not include tokens or secrets**.
        Security issues go through `SECURITY.md`, not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual behavior, including the exact error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: The model prompt, tool names, config shape (redact secrets), and client used.
      placeholder: |
        1. Connect from ...
        2. Ask: "..."
        3. Gateway returns ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the `/healthz` buildHash.
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Gemini web custom app
        - Claude
        - ChatGPT
        - Cursor / Cline
        - Local MCP Inspector / smoke script
        - Other (describe above)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs or `/healthz` output. Remove secrets.
      render: text

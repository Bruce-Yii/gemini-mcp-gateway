# Optional reverse-proxy sketch. No real hostname or certificates included.
# TLS termination and authentication are 需开发; this forwards plain HTTP only.
server {
    listen 80;
    server_name gateway.example.invalid;

    # /mcp caps request bodies at 1 MiB in the gateway; do not set a smaller limit.
    client_max_body_size 2m;

    location /mcp {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # avoid buffering streamed MCP responses
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://gateway:3000;
    }
}
